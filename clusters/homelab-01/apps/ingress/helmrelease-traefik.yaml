# NOTE: K3s ships a Traefik ingress controller by default. Installing this
# HelmRelease without disabling the built-in one will create a second
# Traefik and likely fight over ports 80/443. Install K3s with:
#   curl -sfL https://get.k3s.io | sh -s - --disable traefik
# if you want this Flux-managed Traefik to be the only one.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: ingress
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: "32.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    createNamespace: true
