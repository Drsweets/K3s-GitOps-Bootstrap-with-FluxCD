apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "65.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  # K3s ships its own local-path storage and doesn't run kube-scheduler /
  # kube-controller-manager / etcd as regular pods reachable the same way
  # kube-prometheus-stack expects on a stock kubeadm cluster, so its
  # default scrape jobs for those components will show as "down". That's
  # expected on K3s and can be disabled if the noise is unwanted:
  values:
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
