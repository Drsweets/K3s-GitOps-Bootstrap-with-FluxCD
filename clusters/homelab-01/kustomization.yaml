apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./infrastructure
  - ./apps
# NOTE: flux-system is intentionally NOT listed here. It's reconciled by
# Flux itself (flux bootstrap owns that path) and including it here too
# would make this Kustomization try to manage the GitRepository/
# Kustomization objects that are reconciling it - a circular reference.
